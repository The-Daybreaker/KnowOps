display_name: "KB Manager"
short_description: "通用知识库管理工作流程规范：问题（未解决/已解决）、知识沉淀、项目、日程、任务、看板、自动化提醒、原生日记、剪藏、操作日志、初始化与配置、HTML 镜像导出"
default_prompt: "用 knowledge-base 管理我的知识库。首次接入请先完成初始化向导（确认 vault 实际路径与名称、配置默认写入 vault 内隐藏目录 .config/、按需启用 HTML 镜像导出、询问是否创建看板）。日常按工作流程规范操作：收到记录请求先判定模块类型再路由（问题/项目/日程/剪藏/日记/知识/任务，无法判定时询问用户归属）；创建前先做相似检查；问题按未解决/已解决管理，解决后另行发起沉淀（知识类型交用户审核）；日程口述即录，含时间信号自动创建定时提醒；看板（看板.md + 看板.base）动态反映各模块，操作后确认看板及时更新；每次修改同步 updated（精确到分钟）、积极打标签与建立双向链接；每次操作后记录操作日志、按需更新 HTML 镜像。本 skill 只定义工作流程规范，工具操作层由配套操作规范负责。"
